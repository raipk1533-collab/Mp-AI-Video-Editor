
name: Build MP AI Video Editor APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP"
          unzip -o "$ZIP" -d extracted
          find extracted -name settings.gradle -print

      - name: Build APK
        run: |
          cd extracted/MP_AI_Video_Editor
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MP-AI-Video-Editor-APK
          path: extracted/MP_AI_Video_Editor/app/build/outputs/apk/debug/app-debug.apk
